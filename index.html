/* =========================================================================
 * PROFILE / EMAIL NAME PARSING
 * ========================================================================= */

function formatName(namePart){
  if(!namePart) return '';

  return namePart
    .split('-')
    .map(p =>
      p.charAt(0).toUpperCase() +
      p.slice(1).toLowerCase()
    )
    .join('-');
}


function parseNameFromEmail(email){
  if(!email || !email.includes('@')) return null;

  const handle = email.split('@')[0];
  const parts = handle.split('.');

  if(parts.length < 2) return null;

  const firstName = formatName(parts[0]);

  // Remove trailing digits from last name.
  // Example:
  // jane.doe123 -> Jane Doe
  const rawLastName = parts[1].replace(/\d+$/g, '');
  const lastName = formatName(rawLastName);

  if(!firstName || !lastName) return null;

  return `${firstName} ${lastName}`;
}


function getCurrentEmail(){

/* =========================================================================
 * API CLIENT
 * ========================================================================= */

class ApiError extends Error {
  constructor(message, status){
    super(message);
    this.status = status;
  }
}


async function apiGet(path){
  const { type, token } = CONFIG.getAuth();

  if(!token || token === 'YOUR_JWT_HERE'){
    throw new ApiError(
      'No credential configured for this session.',
      401
    );
  }

  let res;

  try{
    res = await fetch(CONFIG.API_BASE + path, {
      method: 'GET',
      headers: {
        'Authorization': `${type} ${token}`,
        'Accept': 'application/json'
      }
    });
  } catch(networkErr){
    throw new ApiError(
      'Network error contacting the school intranet.',
      0
    );
  }

  if(res.status === 401){
    throw new ApiError(
      'Your school session has expired.',
      401
    );
  }

  if(res.status === 403){
    throw new ApiError(
      'Access to this timetable was denied.',
      403
    );
  }

  if(res.status === 404){
    throw new ApiError(
      'That endpoint was not found.',
      404
    );
  }

  if(!res.ok){
    throw new ApiError(
      `Unexpected server response (${res.status}).`,
      res.status
    );
  }

  const contentType = res.headers.get('Content-Type') || '';

  if(!contentType.includes('application/json')){
    throw new ApiError(
      'Server returned an unexpected response format.',
      res.status
    );
  }

  try{
    return await res.json();
  } catch(parseErr){
    throw new ApiError(
      'Could not parse the server response.',
      res.status
    );
  }
}

/* =========================================================================
 * A/B CYCLE + DATE LOGIC
 * ========================================================================= */

const CYCLE_DAYS = [
  "MonA",
  "TueA",
  "WedA",
  "ThuA",
  "FriA",
  "MonB",
  "TueB",
  "WedB",
  "ThuB",
  "FriB"
];


function extractDateString(startDateRes){
  if(!startDateRes) return null;

  if(typeof startDateRes === 'string'){
    return startDateRes;
  }

  return (
    startDateRes.startDate ||
    startDateRes.StartDate ||
    startDateRes.date ||
    startDateRes.Date ||
    null
  );
}


function getTimetableDay(date, cycleStartDate){

  const d = new Date(
    date.getFullYear(),
    date.getMonth(),
    date.getDate()
  );

  const dow = d.getDay();

  if(dow === 0 || dow === 6){
    return null;
  }

  if(!cycleStartDate){
    return null;
  }

  const start = new Date(
    cycleStartDate.getFullYear(),
    cycleStartDate.getMonth(),
    cycleStartDate.getDate()
  );

  if(d < start){
    return null;
  }

  let schoolDaysElapsed = 0;

  const cursor = new Date(start);

  while(cursor < d){

    cursor.setDate(
      cursor.getDate() + 1
    );

    const cdow = cursor.getDay();

    if(cdow !== 0 && cdow !== 6){
      schoolDaysElapsed++;
    }
  }

  return CYCLE_DAYS[
    schoolDaysElapsed % 10
  ];
}


function dayNameToParts(dayName){

  const week = dayName.slice(-1);

  const dayKey = dayName
    .slice(0,-1)
    .toLowerCase()
    .slice(0,3);

  return {
    dayKey,
    week
  };
}

  fri:"Friday"
};

const DAY_ORDER = [
  "mon",
  "tue",
  "wed",
  "thu",
  "fri"
];

const WEEK_ORDER = [
  "A",
  "B"
];

const FALLBACK_COLORS = [
  "var(--chem)",
  "var(--phys)",
  "var(--ena)",
  "var(--se)",
  "var(--engst)",
  "var(--mah)",
  "var(--max1)",
  "var(--band)"
];

const subjectColorMap = {};


function colorForSubject(key){

  if(!subjectColorMap[key]){

    const idx =
      Object.keys(subjectColorMap).length %
      FALLBACK_COLORS.length;

    subjectColorMap[key] =
      FALLBACK_COLORS[idx];
  }

  return subjectColorMap[key];
}


function findBellTime(
  bellTimes,
  dayName,
  period
){

  if(!Array.isArray(bellTimes)){
    return null;
  }

  const match = bellTimes.find(bt =>

    (
      bt.DayName === dayName ||
      bt.dayName === dayName ||
      (!bt.DayName && !bt.dayName)
    )

    &&

    String(
      bt.Period ?? bt.period
    ) === String(period)

  );

  if(!match){
    return null;
  }

  return {

    start:
      match.StartTime ||
      match.startTime ||
      match.Start ||
      match.start ||
      null,

    end:
      match.EndTime ||
      match.endTime ||
      match.End ||
      match.end ||
      null

  };
}


function classifyPeriod(periodValue){

  const p =
    String(periodValue).toLowerCase();

  if(p.includes('assembly')){
    return 'assembly';
  }

  if(
    p.includes('recess') ||
    p === 'break'
  ){
    return 'break';
  }

  if(p.includes('lunch')){
    return 'lunch';
  }

  return 'class';
}


function normalizeTimetable(
  rawTimetable,
  bellTimes
){

  const grouped = {
    A: {
      mon:[],
      tue:[],
      wed:[],
      thu:[],
      fri:[]
    },

    B: {
      mon:[],
      tue:[],
      wed:[],
      thu:[],
      fri:[]
    }
  };


  if(!Array.isArray(rawTimetable)){
    return grouped;
  }


  for(const raw of rawTimetable){

    const dayName =
      raw.DayName ||
      raw.dayName;

    if(!dayName){
      continue;
    }


    const {
      dayKey,
      week
    } = dayNameToParts(dayName);


    if(
      !grouped[week] ||
      !grouped[week][dayKey]
    ){
      continue;
    }


    const period =
      raw.Period ??
      raw.period;

    const kind =
      classifyPeriod(period);


    const bt =
      findBellTime(
        bellTimes,
        dayName,
        period
      ) ||
      {
        start:
          raw.StartTime ||
          raw.startTime ||
          null,

        end:
          raw.EndTime ||
          raw.endTime ||
          null
      };


    if(kind !== 'class'){

      grouped[week][dayKey].push({

        kind,

        start: bt.start,

        end: bt.end,

        raw

      });

      continue;
    }


    const subjName =
      raw.Subject ||
      raw.SubjectName ||
      raw.subject ||
      raw.Class ||
      raw.class ||
      'Class';


    const code =
      raw.ClassCode ||
      raw.Class ||
      raw.classCode ||
      subjName;


    const subjKey =
      String(subjName)
        .toLowerCase()
        .replace(
          /[^a-z0-9]+/g,
          '-'
        );


    grouped[week][dayKey].push({

      kind: 'class',

      code,

      subjKey,

      subjName,

      teacher:
        raw.Teacher ||
        raw.teacher ||
        null,

      room:
        raw.Room ||
        raw.room ||
        null,

      start: bt.start,

      end: bt.end,

      raw

    });

  }


  for(const week of WEEK_ORDER){

    for(const dayKey of DAY_ORDER){

      grouped[week][dayKey].sort(
        (a,b) => {

          if(
            !a.start ||
            !b.start
          ){
            return 0;
          }

          return (
            timeToMin(a.start) -
            timeToMin(b.start)
          );

        }
      );

    }

  }


  return grouped;
}


function buildRowTimes(schedule){

  const set = new Set();


  for(const week of WEEK_ORDER){

    for(const dayKey of DAY_ORDER){

      (
        schedule[week][dayKey] ||
        []
      ).forEach(item => {

        if(item.start){
          set.add(item.start);
        }

      });

    }

  }


  return Array.from(set)
    .sort(
      (a,b) =>
        timeToMin(a) -
        timeToMin(b)
    );
}


/* =========================================================================
 * RENDERING
 * ========================================================================= */

const grid =
  document.getElementById('grid');

const statusBanner =
  document.getElementById('statusBanner');

const refreshBtn =
  document.getElementById('refreshBtn');

const updatedAtEl =
  document.getElementById('updatedAt');


let SCHEDULE = {

  A:{
    mon:[],
    tue:[],
    wed:[],
    thu:[],
    fri:[]
  },

  B:{
    mon:[],
    tue:[],
    wed:[],
    thu:[],
    fri:[]
  }

};


let ROW_TIMES = [];

let TODAY_CYCLE_DAY = null;

let currentWeek = "A";

let seqIndex = 0;


function setStatus(
  message,
  isError
){

  if(!message){

    statusBanner.style.display =
      'none';

    return;
  }


  statusBanner.style.display =
    'block';

  statusBanner.className =
    'statusBanner' +
    (
      isError
        ? ' error'
        : ''
    );

  statusBanner.textContent =
    message;
}


function timeToMin(t){

  if(!t){
    return 0;
  }

  const [
    h,
    m
  ] = t
    .split(':')
    .map(Number);

  return (
    h * 60 +
    (m || 0)
  );
}


function isToday(
  week,
  dayKey
){

  if(!TODAY_CYCLE_DAY){
    return false;
  }

  return (
    TODAY_CYCLE_DAY ===
    (
      dayKey.charAt(0).toUpperCase() +
      dayKey.slice(1) +
      week
    )
  );
}


function isNowActive(
  week,
  dayKey,
  start,
  end
){

  if(
    !isToday(
      week,
      dayKey
    ) ||
    !start ||
    !end
  ){
    return false;
  }


  const now = new Date();

  const cur =
    now.getHours() * 60 +
    now.getMinutes();


  return (
    cur >= timeToMin(start) &&
    cur < timeToMin(end)
  );
}


function build(){

  grid.innerHTML = '';


  const mobileDay =
    DAY_ORDER[
      seqIndex % 5
    ];


  const mobileWeek =
    WEEK_ORDER[
      Math.floor(seqIndex / 5)
    ];


  const corner =
    document.createElement('div');

  grid.appendChild(corner);


  DAY_ORDER.forEach(d => {

    const h =
      document.createElement('div');

    h.className =
      'head' +

      (
        isToday(
          currentWeek,
          d
        )
          ? ' today'
          : ''
      ) +

      (
        d === mobileDay
          ? ' mobile-active'
          : ''
      );


    h.innerHTML =
      `${DAY_LABELS[d]}<small>Week ${currentWeek}</small>`;


    grid.appendChild(h);

  });


  const dataForWeek =
    SCHEDULE[currentWeek];


  const maxRows =
    ROW_TIMES.length;


  for(
    let r = 0;
    r < maxRows;
    r++
  ){

    const rowStart =
      ROW_TIMES[r];


    const timecol =
      document.createElement('div');

    timecol.className =
      'timecol';

    timecol.innerHTML =
      `<div class="lbl">${rowStart || ''}</div>`;

    grid.appendChild(timecol);


    DAY_ORDER.forEach(d => {

      const item =
        (
          dataForWeek[d] ||
          []
        ).find(
          it =>
            it.start === rowStart
        );


      const cell =
        document.createElement('div');

      cell.className =
        'slot';

      cell.dataset.day =
        d;

      cell.dataset.col =
        '1';

      cell.dataset.active =
        (
          d === mobileDay
        )
          ? '1'
          : '0';


      if(!item){

        // Empty slot.

      }

      else if(
        item.kind === 'break'
      ){

        cell.classList.add(
          'break'
        );

        cell.innerHTML =
          '<span class="tag">Recess</span>';

      }

      else if(
        item.kind === 'lunch'
      ){

        cell.classList.add(
          'break'
        );

        cell.innerHTML =
          '<span class="tag">Lunch</span>';

      }

      else if(
        item.kind === 'assembly'
      ){

        cell.classList.add(
          'break'
        );

        cell.innerHTML =
          '<span class="tag">Assembly</span>';

      }

      else {

        const active =
          isNowActive(
            currentWeek,
            d,
            item.start,
            item.end
          );


        cell.innerHTML = `
          <div
            class="cls ${active ? 'now' : ''}"
            style="--c:${colorForSubject(item.subjKey)}"
          >
            <div class="code">${item.code}</div>
            <div class="subj">${item.subjName}</div>
            ${
              item.room
                ? `<div class="room">${item.room}</div>`
                : ''
            }
          </div>
        `;

      }


      grid.appendChild(cell);

    });

  }


  document.getElementById(
    'weekLabel'
  ).textContent =
    `Week ${currentWeek}`;


  document.getElementById(
    'dayLabel'
  ).textContent =
    DAY_LABELS[mobileDay];


  document.getElementById(
    'dayWeekLabel'
  ).textContent =
    `Week ${mobileWeek}`;
}


function updateBell(){

  const line1 =
    document.getElementById(
      'bellLine1'
    );

  const line2 =
    document.getElementById(
      'bellLine2'
    );


  if(!TODAY_CYCLE_DAY){

    line1.textContent =
      "No school today";

    line2.textContent =
      "Weekend or outside term";

    return;
  }


  const {
    dayKey,
    week
  } =
    dayNameToParts(
      TODAY_CYCLE_DAY
    );


  const now =
    new Date();


  const cur =
    now.getHours() * 60 +
    now.getMinutes();


  const rows =
    SCHEDULE[week][dayKey] ||
    [];


  let current = null;
  let next = null;


  for(const item of rows){

    if(
      item.kind === 'class' &&
      item.start &&
      item.end
    ){

      const s =
        timeToMin(item.start);

      const e =
        timeToMin(item.end);


      if(
        cur >= s &&
        cur < e
      ){

        current =
          item;

        break;
      }


      if(
        cur < s &&
        !next
      ){

        next =
          item;
      }

    }

  }


  if(current){

    line1.textContent =
      `${current.code} — ${current.subjName}`;

    line2.textContent =
      `until ${current.end}${
        current.room
          ? ' · ' + current.room
          : ''
      }`;

  }

  else if(next){

    line1.textContent =
      `Next: ${next.code}`;

    line2.textContent =
      `from ${next.start}${
        next.room
          ? ' · ' + next.room
          : ''
      }`;

  }

  else {

    line1.textContent =
      "No more classes today";

    line2.textContent =
      DAY_LABELS[dayKey];

  }

}


/* =========================================================================
 * REFRESH
 * ========================================================================= */

async function refresh(force){

  refreshBtn.disabled =
    true;


  setStatus(
    force
      ? 'Refreshing timetable…'
      : 'Loading timetable…',
    false
  );


  const currentEmail =
    getCurrentEmail();


  // Immediately show the name parsed from the email.
  updateProfileDisplay(
    currentEmail
  );


  try{

    const {
      timetable,
      bellTimes,
      startDate,
      profile,
      fetchedAt
    } =
      await timetableService.loadAll(
        force
      );


    const cycleStart =
      extractDateString(
        startDate
      );


    const cycleStartDate =
      cycleStart
        ? new Date(cycleStart)
        : null;


    TODAY_CYCLE_DAY =
      cycleStartDate
        ? getTimetableDay(
            new Date(),
            cycleStartDate
          )
        : null;


    if(TODAY_CYCLE_DAY){

      currentWeek =
        TODAY_CYCLE_DAY.slice(-1);


      const dayIdx =
        DAY_ORDER.indexOf(
          TODAY_CYCLE_DAY
            .slice(0,3)
            .toLowerCase()
        );


      seqIndex =
        WEEK_ORDER.indexOf(
          currentWeek
        ) * 5 +

        (
          dayIdx >= 0
            ? dayIdx
            : 0
        );
    }


    SCHEDULE =
      normalizeTimetable(
        timetable,
        bellTimes
      );


    ROW_TIMES =
      buildRowTimes(
        SCHEDULE
      );


    // Update the header using the API profile if available.
    updateProfileDisplay(
      currentEmail,
      profile
    );


    setStatus(null);


    updatedAtEl.textContent =
      `Updated ${
        fetchedAt.toLocaleTimeString(
          [],
          {
            hour:'2-digit',
            minute:'2-digit'
          }
        )
      }`;


    build();

    updateBell();


  } catch(err){

    const msg =
      err instanceof ApiError

        ? `Unable to load timetable. ${err.message}`

        : 'Unable to load timetable. An unexpected error occurred.';


    setStatus(
      msg,
      true
    );


    console.error(
      'Timetable load failed:',
      err.message
    );


  } finally {

    refreshBtn.disabled =
      false;

  }

}


/* =========================================================================
 * EMAIL INPUT
 * ========================================================================= */

const emailInput =
  document.getElementById(
    'emailInput'
  );


emailInput.value =
  CONFIG.USER_EMAIL;


/*
 * Update the name immediately when the user changes
 * the email field.
 */
emailInput.addEventListener(
  'input',
  e => {

    const newEmail =
      e.target.value.trim();


    updateProfileDisplay(
      newEmail
    );

  }
);


/*
 * Actually fetch the new student's timetable
 * when the user finishes editing the email.
 */
emailInput.addEventListener(
  'change',
  e => {

    const newEmail =
      e.target.value.trim();


    if(!newEmail){
      return;
    }


    CONFIG.USER_EMAIL =
      newEmail;


    // Force the timetable service to reload
    // for the new email.
    refresh(true);

  }
);


/*
 * Also allow pressing Enter in the email box
 * to immediately load the timetable.
 */
emailInput.addEventListener(
  'keydown',
  e => {

    if(e.key !== 'Enter'){
      return;
    }


    e.preventDefault();


    const newEmail =
      emailInput.value.trim();


    if(!newEmail){
      return;
    }


    CONFIG.USER_EMAIL =
      newEmail;


    refresh(true);

  }
);


/* =========================================================================
 * BUTTONS
 * ========================================================================= */

refreshBtn.addEventListener(
  'click',
  () => refresh(true)
);


/* Desktop: Week A <-> Week B */

document.getElementById(
  'weekPrev'
).addEventListener(
  'click',
  () => {

    currentWeek =
      currentWeek === 'A'
        ? 'B'
        : 'A';


    seqIndex =
      WEEK_ORDER.indexOf(
        currentWeek
      ) * 5 +

      (
        seqIndex % 5
      );


    build();

  }
);


document.getElementById(
  'weekNext'
).addEventListener(
  'click',
  () => {

    currentWeek =
      currentWeek === 'A'
        ? 'B'
        : 'A';


    seqIndex =
      WEEK_ORDER.indexOf(
        currentWeek
      ) * 5 +

      (
        seqIndex % 5
      );


    build();

  }
);


/* Mobile: loop through all 10 day/week slots */

document.getElementById(
  'dayPrev'
).addEventListener(
  'click',
  () => {

    seqIndex =
      (
        seqIndex + 9
      ) % 10;


    currentWeek =
      WEEK_ORDER[
        Math.floor(
          seqIndex / 5
        )
      ];


    build();

  }
);


document.getElementById(
  'dayNext'
).addEventListener(
  'click',
  () => {

    seqIndex =
      (
        seqIndex + 1
      ) % 10;


    currentWeek =
      WEEK_ORDER[
        Math.floor(
          seqIndex / 5
        )
      ];


    build();

  }
);


/* =========================================================================
 * INITIAL LOAD
 * ========================================================================= */

refresh(false);


setInterval(
  () => {

    updateBell();

    build();

  },
  60000
);


/* =========================================================================
 * THEME
 * ========================================================================= */

const themeBtn =
  document.getElementById(
    'themeToggle'
  );


const mq =
  window.matchMedia(
    '(prefers-color-scheme: dark)'
  );


function applyTheme(theme){

  document.documentElement.dataset.theme =
    theme;

  themeBtn.textContent =
    theme === 'dark'
      ? '☀️'
      : '🌙';
}


let stored =
  localStorage.getItem(
    'timetable-theme'
  );


applyTheme(
  stored ||
  (
    mq.matches
      ? 'dark'
      : 'light'
  )
);


mq.addEventListener(
  'change',
  e => {

    if(
      !localStorage.getItem(
        'timetable-theme'
      )
    ){

      applyTheme(
        e.matches
          ? 'dark'
          : 'light'
      );

    }

  }
);


themeBtn.addEventListener(
  'click',
  () => {

    const next =
      document.documentElement
        .dataset
        .theme === 'dark'
        ? 'light'
        : 'dark';


    localStorage.setItem(
      'timetable-theme',
      next
    );


    applyTheme(next);

  }
);

</script>
