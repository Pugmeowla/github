<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andre Kwok — Timetable</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root {
  --glass: rgba(255,255,255,.55);
  --glass-hi: rgba(255,255,255,.75);
  --line: rgba(255,255,255,.6);

  --ink: #1d1d1f;
  --ink-soft: rgba(29,29,31,.55);
  --ink-faint: rgba(29,29,31,.35);

  --accent: #0a84ff;

  --cat-math: #FFA9A6;
  --cat-english: #FEFB99;
  --cat-technology: #FFD5F4;
  --cat-music: #E0C0F4;
  --cat-science: #A4FEFF;
  --cat-hsie: #D7CDB3;
  --cat-languages: #f2884b;
  --cat-va: #FFADFF;
  --cat-other: #A5D5FF;

  --break-bg: rgba(255,255,255,.28);
  --break-line: rgba(29,29,31,.12);

  --page-bg: transparent;

  --shadow-panel:
    0 10px 34px rgba(0,0,0,.14),
    0 2px 8px rgba(0,0,0,.06);

  --shadow-card:
    0 8px 22px rgba(0,0,0,.14),
    0 2px 6px rgba(0,0,0,.08);

  --shadow-card-hover:
    0 14px 32px rgba(0,0,0,.18),
    0 4px 10px rgba(0,0,0,.1);

  /*
    Horizontal spacing between days.
    This is intentionally the same visual spacing
    used around timetable sections/cards.
  */
  --column-gap: 8px;
}

[data-theme="dark"] {
  --glass: rgba(32,32,36,.5);
  --glass-hi: rgba(44,44,48,.62);
  --line: rgba(255,255,255,.12);

  --ink: #f5f5f7;
  --ink-soft: rgba(245,245,247,.62);
  --ink-faint: rgba(245,245,247,.38);

  --accent: #409cff;

  --break-bg: rgba(255,255,255,.05);
  --break-line: rgba(255,255,255,.14);

  /* Subject colours — dark mode */
  --cat-math: #FF8582;
  --cat-english: #FFF06A;
  --cat-technology: #FF9BDD;
  --cat-music: #CFA8F4;
  --cat-science: #76F0F2;
  --cat-hsie: #D8C99F;
  --cat-languages: #FF9B63;
  --cat-other: #82C5FF;
  --cat-va: #E56BE5;

  --page-bg:
    radial-gradient(
      circle at 20% 10%,
      rgba(255,255,255,.05),
      transparent 55%
    ),
    rgba(16,17,20,.78);

  --shadow-panel:
    0 10px 34px rgba(0,0,0,.5),
    0 2px 8px rgba(0,0,0,.35);

  --shadow-card:
    0 8px 22px rgba(0,0,0,.45),
    0 2px 6px rgba(0,0,0,.3);

  --shadow-card-hover:
    0 14px 32px rgba(0,0,0,.55),
    0 4px 10px rgba(0,0,0,.35);
}

* {
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    Inter,
    sans-serif;

  color: var(--ink);
  min-height: 100vh;

  padding: 36px 18px 70px;

  background: var(--page-bg);
  background-attachment: fixed;
}

.wrap {
  max-width: 1180px;
  margin: 0 auto;
}

/* =========================================================
   HEADER
========================================================= */

header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;

  gap: 16px;

  padding: 18px 26px;
  margin-bottom: 26px;

  background: var(--glass);

  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);

  border: 1px solid var(--line);
  border-radius: 26px;

  box-shadow: var(--shadow-panel);
}

.title-block .eyebrow {
  font-size: 11px;
  font-weight: 600;

  letter-spacing: .08em;
  text-transform: uppercase;

  color: var(--ink-faint);

  margin-bottom: 4px;
}

h1 {
  font-weight: 700;
  font-size: clamp(24px, 4vw, 32px);

  margin: 0;
  letter-spacing: -.02em;

  color: var(--ink);
}

.sub {
  font-size: 13px;
  color: var(--ink-soft);

  margin-top: 3px;
  font-weight: 400;
}

/* =========================================================
   EMAIL
========================================================= */

.emailInputWrap {
  margin-top: 10px;
}

#emailInput {
  font-family: inherit;
  font-size: 12px;

  padding: 6px 10px;

  border-radius: 10px;
  border: 1px solid var(--line);

  background: var(--glass-hi);
  color: var(--ink);

  width: 260px;
  outline: none;

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

#emailInput:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(10,132,255,.12);
}

#emailInput::placeholder {
  color: var(--ink-faint);
}

.emailHint {
  font-size: 10.5px;
  color: var(--ink-faint);
  margin-top: 5px;
}

/* =========================================================
   BELL
========================================================= */

.bell {
  background: var(--glass-hi);

  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);

  border: 1px solid var(--line);
  border-radius: 18px;

  padding: 12px 18px;
  min-width: 230px;

  box-shadow: var(--shadow-panel);
}

.bell .eyebrow2 {
  font-size: 10px;
  font-weight: 700;

  letter-spacing: .1em;

  color: var(--accent);

  margin-bottom: 3px;
}

.bell .line1 {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.01em;
}

.bell .line2 {
  font-size: 12.5px;
  color: var(--ink-soft);
  margin-top: 2px;
}

.refreshRow {
  display: flex;
  align-items: center;
  gap: 8px;

  margin-top: 8px;
}

.refreshBtn {
  font-family: inherit;

  font-size: 11px;
  font-weight: 600;

  color: var(--accent);
  background: transparent;

  border: 1px solid var(--line);
  border-radius: 10px;

  padding: 4px 9px;

  cursor: pointer;

  transition:
    background .2s ease,
    transform .2s ease;
}

.refreshBtn:hover {
  background: var(--glass-hi);
}

.refreshBtn:active {
  transform: scale(.95);
}

.refreshBtn[disabled] {
  opacity: .5;
  cursor: default;
}

.updatedAt {
  font-size: 10.5px;
  color: var(--ink-faint);
}

/* =========================================================
   STATUS
========================================================= */

.statusBanner {
  text-align: center;

  font-size: 13px;
  font-weight: 500;

  padding: 12px 18px;
  margin-bottom: 20px;

  border-radius: 16px;

  background: var(--glass);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  border: 1px solid var(--line);

  color: var(--ink-soft);
}

.statusBanner.error {
  color: #c23b2f;
  border-color: rgba(194,59,47,.35);
}

/* =========================================================
   BUTTONS
========================================================= */

.arrowbtn {
  width: 34px;
  height: 34px;

  border-radius: 50%;

  border: 1px solid var(--line);

  background: var(--glass-hi);
  color: var(--ink);

  font-size: 15px;
  font-weight: 700;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  transition:
    transform .2s ease,
    background .2s ease;

  flex-shrink: 0;
}

.arrowbtn:hover {
  background: var(--ink);
  color: #fff;

  transform: scale(1.06);
}

.arrowbtn:active {
  transform: scale(.94);
}

/* =========================================================
   WEEK
========================================================= */

.weekSwitch {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 14px;

  margin-bottom: 20px;
}

.weekSwitch .label {
  min-width: 90px;

  text-align: center;

  font-weight: 600;
  font-size: 15px;
}

/* =========================================================
   MOBILE DAY
========================================================= */

.daySwitch {
  display: none;

  align-items: center;
  justify-content: center;

  gap: 14px;

  margin-bottom: 18px;
  padding: 10px 16px;

  background: var(--glass);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  border: 1px solid var(--line);
  border-radius: 18px;
}

.daySwitch .label {
  text-align: center;
  min-width: 130px;
}

.daySwitch .day {
  font-weight: 700;
  font-size: 15px;
}

.daySwitch .week {
  font-size: 11px;
  font-weight: 600;

  color: var(--ink-faint);

  text-transform: uppercase;
  letter-spacing: .06em;

  margin-top: 1px;
}

/* =========================================================
   TIMETABLE
========================================================= */

.grid {
  display: grid;

  /*
    Increased from 10px to 16px so the space between
    day columns visually matches the section/card spacing.
  */
  grid-template-columns: 60px repeat(5, 1fr);

  column-gap: var(--column-gap);
  row-gap: var(--column-gap);
}

.grid .head {
  font-weight: 600;

  font-size: 14px;

  text-align: center;

  padding: 10px 4px 14px;

  color: var(--ink);
}

.grid .head small {
  display: block;

  font-weight: 400;
  font-size: 10.5px;

  color: var(--ink-faint);

  margin-top: 2px;

  text-transform: uppercase;
  letter-spacing: .05em;
}

.grid .head.today {
  color: var(--accent);
}

.grid .head.today::after {
  content: "";

  display: block;

  width: 5px;
  height: 5px;

  border-radius: 50%;

  background: var(--accent);

  margin: 5px auto 0;
}

/* =========================================================
   TIMELINE
========================================================= */

.day-column {
  position: relative;

  min-height: 610px;

  background: rgba(255,255,255,.025);

  border-radius: 18px;
}

[data-theme="dark"] .day-column {
  background: rgba(255,255,255,.015);
}

.time-column {
  position: relative;

  min-height: 610px;
}

.time-label {
  position: absolute;

  left: 0;
  right: 0;

  transform: translateY(-50%);

  text-align: center;

  font-size: 10.5px;
  font-weight: 500;

  color: var(--ink-faint);
}

/* =========================================================
   CARDS
========================================================= */

.cls {
  position: absolute;

  left: 0;
  right: 0;

  background: var(--glass-hi);

  backdrop-filter: blur(18px) saturate(180%);
  -webkit-backdrop-filter: blur(18px) saturate(180%);

  border: 1px solid var(--line);
  border-radius: 16px;

  /*
    Slight inset gives visually separated sections without
    changing their actual timeline positions.
  */
  margin-top: 3px;
  margin-bottom: 3px;

  padding: 10px 12px;

  display: flex;
  flex-direction: column;

  gap: 3px;

  box-shadow: var(--shadow-card);

  transition:
    transform .25s ease,
    box-shadow .25s ease;

  overflow: hidden;
}

.cls:hover {
  transform: translateY(-2px);

  box-shadow: var(--shadow-card-hover);
}

.cls .code {
  font-weight: 700;

  font-size: 12px;

  color: var(--ink);

  padding-left: 12px;

  position: relative;
}

.cls .code::before {
  content: "";

  position: absolute;

  left: 0;
  top: 3px;

  width: 6px;
  height: 6px;

  border-radius: 50%;

  background: var(--c, var(--accent));
}

.cls .teacher {
  font-size: 11px;

  color: var(--ink-soft);

  margin-top: 3px;
}

.cls .room {
  font-size: 11px;

  color: var(--ink-soft);

  margin-top: auto;
}

.cls.now {
  outline: 2px solid var(--accent);
  outline-offset: 0;
}

.grid[data-outline-colors="1"] .cls:not(.now) {
  outline: 2.5px solid var(--c, var(--accent));
  outline-offset: 0;
}

/* =========================================================
   BREAKS
========================================================= */

.break-card {
  position: absolute;

  left: 0;
  right: 0;

  margin-top: 3px;
  margin-bottom: 3px;

  display: flex;

  align-items: center;
  justify-content: center;

  background: var(--break-bg);

  border: 1px dashed var(--break-line);

  border-radius: 16px;

  color: var(--ink-faint);
}

.break-card .tag {
  font-size: 10.5px;

  font-weight: 600;

  letter-spacing: .06em;

  text-transform: uppercase;
}

/* =========================================================
   THEME
========================================================= */

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.themeToggle {
  position: static;
  flex-shrink: 0;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--glass-hi);
  color: var(--ink);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  box-shadow: var(--shadow-panel);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  cursor: pointer;
  transition: transform .2s ease;
}

.themeToggle:hover {
  transform: scale(1.08);
}

.themeToggle:active {
  transform: scale(.92);
}

/* =========================================================
   HEADER BUTTONS
========================================================= */

.header-buttons {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.schoolToggle {
  order: 2;
}

.infoToggle {
  order: 1;
}

.infoToggle {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--glass-hi);
  color: var(--ink);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  box-shadow: var(--shadow-panel);

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: inherit;
  font-size: 17px;
  font-weight: 600;

  cursor: pointer;
  text-decoration: none;

  transition:
    transform .2s ease,
    background .2s ease;
}

.infoToggle:hover {
  transform: scale(1.08);
  background: var(--glass);
}

.infoToggle:active {
  transform: scale(.92);
}

/* =========================================================
   INFORMATION POPUP
========================================================= */

.infoOverlay {
  position: fixed;
  inset: 0;
  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(0, 0, 0, .25);

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  opacity: 0;
  visibility: hidden;

  transition:
    opacity .2s ease,
    visibility .2s ease;
}

.infoOverlay.open {
  opacity: 1;
  visibility: visible;
}

.infoPopup {
  width: min(620px, 100%);
  max-height: min(720px, 90vh);

  display: flex;
  flex-direction: column;

  background: var(--glass-hi);

  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);

  border: 1px solid var(--line);
  border-radius: 26px;

  box-shadow:
    0 24px 70px rgba(0, 0, 0, .25),
    0 4px 16px rgba(0, 0, 0, .12);

  transform: translateY(12px) scale(.97);

  transition:
    transform .25s ease;
}

.infoOverlay.open .infoPopup {
  transform: translateY(0) scale(1);
}

.infoPopupHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 20px 22px 14px;
}

.infoPopupTitle {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -.02em;
}

.infoPopupSubtitle {
  font-size: 11px;
  color: var(--ink-faint);
  margin-top: 3px;
}

.infoClose {
  width: 32px;
  height: 32px;

  border: 0;
  border-radius: 50%;

  background: var(--glass);
  color: var(--ink);

  font-family: inherit;
  font-size: 20px;
  line-height: 1;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  transition:
    transform .2s ease,
    background .2s ease;
}

.infoClose:hover {
  background: var(--glass-hi);
  transform: scale(1.08);
}

.infoClose:active {
  transform: scale(.92);
}

.infoPopupBody {
  padding: 0 22px 22px;
  overflow-y: auto;
}

.settingsSection {
  margin-bottom: 18px;
}

.settingsHeading {
  font-size: 11px;
  font-weight: 700;

  letter-spacing: .08em;
  text-transform: uppercase;

  color: var(--ink-faint);

  margin-bottom: 10px;
}

.settingsRow {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;

  padding: 12px 14px;

  background: var(--glass);

  border: 1px solid var(--line);
  border-radius: 14px;
}

.settingsRow + .settingsRow {
  margin-top: 8px;
}

.settingsRow .settingsLabel {
  font-size: 13.5px;
  font-weight: 600;

  color: var(--ink);
}

.settingsRow .settingsHint {
  font-size: 11px;
  color: var(--ink-faint);

  margin-top: 2px;
}

.switch {
  position: relative;

  width: 42px;
  height: 25px;

  flex-shrink: 0;

  border-radius: 999px;

  border: 1px solid var(--line);
  background: var(--glass-hi);

  cursor: pointer;

  transition: background .2s ease;
}

.switch .knob {
  position: absolute;

  top: 2px;
  left: 2px;

  width: 19px;
  height: 19px;

  border-radius: 50%;

  background: #fff;

  box-shadow: 0 2px 5px rgba(0,0,0,.25);

  transition: transform .2s ease;
}

.switch.on {
  background: var(--accent);
  border-color: var(--accent);
}

.switch.on .knob {
  transform: translateX(17px);
}

.infoTextarea {
  width: 100%;
  min-height: 280px;
  max-height: 55vh;

  resize: vertical;

  padding: 16px;

  border: 1px solid var(--line);
  border-radius: 16px;

  background: var(--glass);
  color: var(--ink);

  font-family: inherit;
  font-size: 14px;
  line-height: 1.55;

  outline: none;

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

.infoTextarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(10, 132, 255, .12);
}

.infoTextarea::placeholder {
  color: var(--ink-faint);
}

.infoPopupFooter {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;

  margin-top: 10px;
}

.infoSaved {
  font-size: 11px;
  color: var(--ink-faint);
}

.infoClear {
  border: 1px solid var(--line);
  border-radius: 10px;

  padding: 7px 11px;

  background: var(--glass);
  color: var(--ink-soft);

  font-family: inherit;
  font-size: 11px;
  font-weight: 600;

  cursor: pointer;

  transition:
    background .2s ease,
    transform .2s ease;
}

.infoClear:hover {
  background: var(--glass-hi);
}

.infoClear:active {
  transform: scale(.96);
}

@media(max-width:760px) {

  .header-buttons {
    flex-direction: row;
  }

  .schoolToggle {
    order: 2;
  }

  .infoToggle {
    order: 1;
  }

  .infoOverlay {
    align-items: flex-end;
    padding: 12px;
  }

  .infoPopup {
    max-height: 90vh;
    border-radius: 24px;
  }

  .infoTextarea {
    min-height: 240px;
  }
}
/* =========================================================
   MOBILE
========================================================= */

@media(max-width:760px) {

  header {
    flex-direction: column;
    text-align: center;
  }

  .title-block {
    display: flex;

    flex-direction: column;
    align-items: center;

    width: 100%;
  }

  #emailInput {
    width: min(260px, 90vw);
  }

  .header-right {
    flex-direction: column;

    width: 100%;
    align-items: center;

    gap: 12px;
  }

  .bell {
    align-self: stretch;
    text-align: center;

    width: 100%;
    max-width: 320px;

    margin: 0 auto;
  }

  .refreshRow {
    justify-content: center;
  }

  .weekSwitch {
    display: none;
  }

  .daySwitch {
    display: flex;
  }

  .grid {
    grid-template-columns: 1fr;

    column-gap: 0;
    row-gap: 10px;
  }

  .grid .corner-cell {
    display: none;
  }

  .grid .head {
    display: none;
  }

  .grid .head.mobile-active {
    display: block;
  }

  .grid > .time-column {
    display: none;
  }

  .grid > .day-column {
    display: none;
  }

  .grid > .day-column[data-active="1"] {
    display: block;

    grid-column: 1;

    max-width: 420px;
    margin: 0 auto;
    width: 100%;
  }
}
</style>
</head>

<body>



<div class="wrap">

<header>

  <div class="title-block">

    <div class="eyebrow">
      NBSC Manly Campus
    </div>

    <h1 id="profileName">
      Andre Kwok
    </h1>

    <div class="emailInputWrap">
     <input
  type="text"
  id="emailInput"
  placeholder="Enter the start of your email"
  autocomplete="username"
>
<div class="emailHint">
  Enter the start of your email and press Enter
</div>
    </div>

  </div>

<div class="header-right">
  <div class="bell">
    <div class="eyebrow2">
      NOW
    </div>

    <div
      class="line1"
      id="bellLine1"
    >
      Loading…
    </div>

    <div
      class="line2"
      id="bellLine2"
    ></div>

    <div class="refreshRow">
      <button
        class="refreshBtn"
        id="refreshBtn"
        title="Refresh timetable"
      >
        ↻ Refresh
      </button>

      <span
        class="updatedAt"
        id="updatedAt"
      ></span>
    </div>
  </div>

function formatName(name) {

  if (!name)
    return "";

  return name
    .split(/[-\s]+/)
    .filter(Boolean)
    .map(part =>
      part.charAt(0).toUpperCase() +
      part.slice(1).toLowerCase()
    )
    .join(" ");
}

function timeToMin(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  )
    return 0;

  let str =
    String(value).trim();

  const ampm =
    str.match(/\s*(AM|PM)$/i);

  str =
    str.replace(/\s*(AM|PM)$/i, "");

  const parts =
    str.split(":");

  let h =
    Number(parts[0]);

  let m =
    Number(parts[1] || 0);

  if (ampm) {

    const pm =
      ampm[1].toLowerCase() === "pm";

    if (pm && h < 12)
      h += 12;

    if (!pm && h === 12)
      h = 0;
  }

  return h * 60 + m;
}


function formatTime(value) {

  if (!value)
    return "";

  const total =
    timeToMin(value);

  const h =
    Math.floor(total / 60);

  const m =
    total % 60;

  return (
    String(h).padStart(2, "0") +
    ":" +
    String(m).padStart(2, "0")
  );
}


/*
  IMPORTANT FIX:
  Converts values such as:

    1
    "1"
    "Period 1"
    "period 1"
    "P1"

  into:

    "1"
*/
function getPeriodNumber(value) {

  if (
    value === null ||
    value === undefined
  )
    return "";

  const str =
    String(value).trim();

  const match =
    str.match(/(?:period|p)?\s*(\d+)/i);

  return match
    ? match[1]
    : str;
}

class ApiError extends Error {

  constructor(message, status) {

    super(message);

    this.status = status;
  }
}


async function apiGet(path) {

  const {
    type,
    token
  } = CONFIG.getAuth();

  if (
    !token ||
    token === "YOUR_JWT_HERE"
  ) {

    throw new ApiError(
      "No credential configured for this session.",
      401
    );
  }

  let res;

  try {

    res = await fetch(
      CONFIG.API_BASE + path,
      {
        method: "GET",

        headers: {
          Authorization:
            `${type} ${token}`,

          Accept:
            "application/json"
        }
      }
    );

  } catch (e) {

    throw new ApiError(
      "Network error contacting the school intranet.",
      0
    );
  }

  if (res.status === 401)

    throw new ApiError(
      "Your school session has expired.",
      401
    );

  if (res.status === 403)

    throw new ApiError(
      "Access to this timetable was denied.",
      403
    );

  if (res.status === 404)

    throw new ApiError(
      "That endpoint was not found.",
      404
    );

  if (!res.ok)

    throw new ApiError(
      `Unexpected server response (${res.status}).`,
      res.status
    );

  const contentType =
    res.headers.get("Content-Type") || "";

  if (!contentType.includes("application/json"))

    throw new ApiError(
      "Server returned an unexpected response format.",
      res.status
    );

  return await res.json();
}

function getTimetableDay(
  date,
  cycleStartDate
) {

  const d =
    new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()
    );

  const dow =
    d.getDay();

  if (
    dow === 0 ||
    dow === 6
  )
    return null;

  if (!cycleStartDate)
    return null;

  const start =
    new Date(
      cycleStartDate.getFullYear(),
      cycleStartDate.getMonth(),
      cycleStartDate.getDate()
    );

  if (d < start)
    return null;

  let elapsed = 0;

  const cursor =
    new Date(start);

  while (cursor < d) {

    cursor.setDate(
      cursor.getDate() + 1
    );

    const cdow =
      cursor.getDay();

    if (
      cdow !== 0 &&
      cdow !== 6
    )
      elapsed++;
  }

  return CYCLE_DAYS[
    elapsed % 10
  ];
}


function dayNameToParts(dayName) {

  const clean =
    String(dayName)
      .trim();

  const week =
    clean.slice(-1)
      .toUpperCase();

  const dayKey =
    clean
      .slice(0, -1)
      .toLowerCase()
      .slice(0, 3);

  return {
    dayKey,
    week
  };
}

/* =========================================================
   BELL TIMES
========================================================= */

function findBellTime(
  bellTimes,
  dayName,
  period
) {

  if (!Array.isArray(bellTimes))
    return null;

  const p =
    getPeriodNumber(period)
      .toLowerCase();

  const d =
    String(dayName ?? "")
      .trim()
      .toLowerCase();


  let match =
    bellTimes.find(bt => {

      const bp =
        getPeriodNumber(
          bt.Period ??
          bt.period ??
          bt.PeriodNumber ??
          bt.periodNumber ??
          ""
        ).toLowerCase();

      const bd =
        String(
          bt.DayName ??
          bt.dayName ??
          ""
        )
        .trim()
        .toLowerCase();

      return (
        bp === p &&
        bd === d
      );
    });


  if (!match) {

    match =
      bellTimes.find(bt => {

        const bp =
          getPeriodNumber(
            bt.Period ??
            bt.period ??
            bt.PeriodNumber ??
            bt.periodNumber ??
            ""
          ).toLowerCase();

        const hasDay =
          bt.DayName ||
          bt.dayName;

        return (
          !hasDay &&
          bp === p
        );
      });
  }


  if (!match) {

    match =
      bellTimes.find(bt => {

        const bp =
          getPeriodNumber(
            bt.Period ??
            bt.period ??
            bt.PeriodNumber ??
            bt.periodNumber ??
            ""
          ).toLowerCase();

        return bp === p;
      });
  }


  if (!match)
    return null;


  return {

    start:
      match.StartTime ??
      match.startTime ??
      match.Start ??
      match.start ??
      match.BellStart ??
      match.bellStart ??
      null,

    end:
      match.EndTime ??
      match.endTime ??
      match.End ??
      match.end ??
      match.BellEnd ??
      match.bellEnd ??
      null

  };
}

function classifyPeriod(value) {

  const p =
    String(value ?? "")
      .toLowerCase();

  if (
    p.includes("assembly")
  )
    return "assembly";

  if (
    p.includes("recess") ||
    p === "break"
  )
    return "break";

  if (
    p.includes("lunch")
  )
    return "lunch";

  return "class";
}


function getTeacher(raw) {

    raw.teacherFullName ??
    raw.Teacher ??
    raw.teacher ??
    raw.StaffName ??
    raw.staffName ??
    "";

  if (!value)
    return "";

  if (
    typeof value === "string" &&
    value.includes("@")
  ) {

    const local =
      value.split("@")[0];

    const parts =
      local.split(".");

    if (parts.length >= 2) {

      return (

        " " +
        formatName(
          parts[1].replace(/\d+$/, "")
        )
      );
    }

    return formatName(
      local.replace(/\d+$/, "")
    );
  }

  return String(value).trim();
}

/* =========================================================
   NORMALISE TIMETABLE
========================================================= */

function normalizeTimetable(
  rawTimetable,
  bellTimes
) {

  const grouped = {

    A: {
      mon: [],
      tue: [],
      wed: [],
      thu: [],
      fri: []
    },

    B: {
      mon: [],
      tue: [],
      wed: [],
      thu: [],
      fri: []
    }

  };


  if (!Array.isArray(rawTimetable))
    return grouped;


  for (const raw of rawTimetable) {

    const dayName =
      raw.DayName ||
      raw.dayName;

    if (!dayName)
      continue;


    const {
      dayKey,
      week
    } =
      dayNameToParts(dayName);


    if (
      !grouped[week] ||
      !grouped[week][dayKey]
    )
      continue;


    const period =
      raw.Period ??
      raw.period;


    const kind =
      classifyPeriod(period);


    const times =
      getRawTimes(
        raw,
        bellTimes,
        dayName,
        period
      );


    const subject =
      getSubject(raw);


    const code =
      getCode(
        raw,
        subject
      );


    if (kind !== "class") {

      grouped[week][dayKey].push({

        kind,

        start: times.start,
        end: times.end,

        raw
      });

      continue;
    }


    grouped[week][dayKey].push({

      kind: "class",

      code,

      periodNumber:
        getPeriodNumber(period),

      subjKey:
        String(subject + " " + code)
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-"),

      subjName: subject,

      teacher:
        getTeacher(raw),

      room:
        getRoom(raw),

      start: times.start,
      end: times.end,

      raw

    });
  }


  /* =======================================================
     EXPLICIT SCHOOL BREAKS
  ======================================================= */

  for (const week of WEEK_ORDER) {

    for (const day of DAY_ORDER) {

      const rows =
        grouped[week][day];

      const isWednesday =
        day === "wed";

      const breaks = [];


      if (isWednesday) {

        breaks.push({

          kind: "assembly",

          start: "10:45",
          end: "11:05"

        });


        breaks.push({

          kind: "break",

          start: "11:05",
          end: "11:25"

        });


        breaks.push({

          kind: "lunch",

          start: "12:20",
          end: "13:00"

        });

      } else {

        breaks.push({

          kind: "break",

          start: "10:45",
          end: "11:05"

        });


        breaks.push({

          kind: "lunch",

          start: "12:55",
          end: "13:35"

        });

      }


      for (const br of breaks) {

        const exists =
          rows.some(item =>

            item.start &&
            item.end &&

            timeToMin(item.start) ===
              timeToMin(br.start) &&

            timeToMin(item.end) ===
              timeToMin(br.end)

          );


        if (!exists)
          rows.push(br);
      }


      /* =====================================================
         WEDNESDAY OVERRIDES

         P1/P2 = EXACTLY THE SAME AS OTHER DAYS

         P3 = 11:25 → 12:20
         Lunch = 12:20 → 13:00
         P4 = 13:00 → 13:55
         P5 = 13:55 → 14:50

         This is deliberately based on the extracted
         period number, so "Period 1", "P1", 1, etc.
         all work correctly.
      ===================================================== */

      if (isWednesday) {

const wednesdayTimes = {
  "0": {
    start: "07:55",
    end: "08:55"
  },
  "1": {
    start: "08:55",
    end: "09:50"
  },
  "2": {
    start: "09:50",
    end: "10:45"
  },
  "3": {
    start: "11:25",
    end: "12:20"
  },
  "4": {
    start: "13:00",
    end: "13:55"
  },
  "5": {
    start: "13:55",
    end: "14:50"
  }
};


        for (const item of rows) {

          if (
            item.kind !== "class"
          )
            continue;


          const period =
            item.periodNumber ||
            getPeriodNumber(
              item.raw?.Period ??
              item.raw?.period
            );


          if (
            wednesdayTimes[period]
          ) {

            item.start =
              wednesdayTimes[
                period
              ].start;

            item.end =
              wednesdayTimes[
                period
              ].end;
          }
        }
      }


      /* =====================================================
         SORT BY REAL TIME
      ===================================================== */

      rows.sort(
        (a, b) =>
          timeToMin(a.start) -
          timeToMin(b.start)
      );

    }
  }


  return grouped;
}


/* =========================================================
   RENDER
========================================================= */

const grid =
  document.getElementById("grid");

const statusBanner =
  document.getElementById("statusBanner");

  document.getElementById("updatedAt");


let SCHEDULE = {

  A: {
    mon: [],
    tue: [],
    wed: [],
    thu: [],
    fri: []
  },

  B: {
    mon: [],
    tue: [],
    wed: [],
    thu: [],
    fri: []
  }

};


let TODAY_CYCLE_DAY = null;

let currentWeek = "A";

let seqIndex = 0;


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  message,
  isError = false
) {

  if (!message) {

    statusBanner.style.display =
      "none";

    return;
  }

  statusBanner.style.display =
    "block";

  statusBanner.className =
    "statusBanner" +
    (isError ? " error" : "");

  statusBanner.textContent =
    message;
}


/* =========================================================
   DAY TIMELINE
========================================================= */

/*
  07:55 → 14:50

  Wednesday uses the exact same coordinate system,
  but its classes intentionally have large gaps for:

  Assembly:
    10:45 → 11:05

  Recess:
    11:05 → 11:25

  Lunch:
    12:20 → 13:00
*/

const DEFAULT_TIMELINE_START = 7 * 60 + 55;
const NO_PERIOD_0_START = 8 * 60 + 55;

const TIMELINE_END =
  14 * 60 + 50;

const TIMELINE_HEIGHT =
  610;

let TIMELINE_START =
  DEFAULT_TIMELINE_START;

function hasPeriodZero() {
  const week = SCHEDULE[currentWeek];

  if (!week) return false;

  return DAY_ORDER.some(day =>
    (week[day] || []).some(item =>
      item.kind === "class" &&
      String(item.periodNumber) === "0"
    )
  );
}

function hasPeriodZeroForDay(week, day) {

  const rows =
    SCHEDULE[week]?.[day] || [];

  return rows.some(item =>
    item.kind === "class" &&
    String(item.periodNumber) === "0"
  );
}

function timelineTop(time, timelineStart) {

  const base =
    timelineStart !== undefined
      ? timelineStart
      : TIMELINE_START;

  const minutes =
    timeToMin(time) -
    base;

  return (
    minutes /
    (TIMELINE_END - base)
  ) *
  TIMELINE_HEIGHT;
}


function timelineHeight(
  start,
  end,
  timelineStart
) {

  const base =
    timelineStart !== undefined
      ? timelineStart
      : TIMELINE_START;

  const duration =
    timeToMin(end) -
    timeToMin(start);

  return (
    duration /
    (TIMELINE_END - base)
  ) *
  TIMELINE_HEIGHT;
}


/* =========================================================
   TODAY
========================================================= */

function isToday(
  week,
  dayKey
) {

  if (!TODAY_CYCLE_DAY)
    return false;

  return (
    TODAY_CYCLE_DAY ===
    (
      dayKey.charAt(0).toUpperCase() +
      dayKey.slice(1) +
      week
    )
  );
}


function isNowActive(
  week,
  dayKey,
  start,
  end
) {

  if (
    !isToday(
      week,
      dayKey
    ) ||
    !start ||
    !end
  )
    return false;


  const now =
    new Date();

  const cur =
    now.getHours() * 60 +
    now.getMinutes();


  return (
    cur >= timeToMin(start) &&
    cur < timeToMin(end)
  );
}


/* =========================================================
   BUILD
========================================================= */

function build() {
  grid.innerHTML = "";

  // Hide Period 0 entirely if this student does not have one
  TIMELINE_START = hasPeriodZero()
    ? DEFAULT_TIMELINE_START
    : NO_PERIOD_0_START;

  const mobileDay =
    DAY_ORDER[
      seqIndex % 5
    ];


  const mobileWeek =
    WEEK_ORDER[
      Math.floor(seqIndex / 5)
    ];


  const isMobileView =
    window.matchMedia(
      "(max-width:760px)"
    ).matches;


  /* Corner */

  const corner =
    document.createElement("div");

  corner.className =
    "corner-cell";

  grid.appendChild(corner);


  /* Day headers */

  DAY_ORDER.forEach(day => {

    const head =
      document.createElement("div");

    head.className =
      "head" +

      (
        isToday(
          currentWeek,
          day
        )
          ? " today"
          : ""
      ) +

      (
        day === mobileDay
          ? " mobile-active"
          : ""
      );


    head.innerHTML =
      `${DAY_LABELS[day]}
       <small>Week ${currentWeek}</small>`;


    grid.appendChild(head);

  });


  /* =======================================================
     TIME COLUMN
  ======================================================= */

  const timeColumn =
    document.createElement("div");

  timeColumn.className =
    "time-column";


  const labels = [

    "07:55",
    "08:55",
    "09:50",
    "10:45",
    "11:05",
    "11:25",
    "12:20",
    "12:55",
    "13:00",
    "13:35",
    "13:55",
    "14:50"

  ];


  [
    ...new Set(labels)
  ].forEach(time => {

    if (
      timeToMin(time) <
      TIMELINE_START ||

      timeToMin(time) >
      TIMELINE_END
    )
      return;


    const label =
      document.createElement("div");

    label.className =
      "time-label";


    label.style.top =
      `${timelineTop(time)}px`;


    label.textContent =
      time;


    timeColumn.appendChild(label);

  });


  grid.appendChild(timeColumn);


  /* =======================================================
     DAY COLUMNS
  ======================================================= */

  DAY_ORDER.forEach(day => {

    const column =
      document.createElement("div");

    column.className =
      "day-column";


    column.dataset.day =
      day;


    column.dataset.active =
      day === mobileDay
        ? "1"
        : "0";


    const rows =
      SCHEDULE[
        currentWeek
      ]?.[day] || [];


    const dayTimelineStart =
      (isMobileView && day === mobileDay)
        ? (
            hasPeriodZeroForDay(currentWeek, day)
              ? DEFAULT_TIMELINE_START
              : NO_PERIOD_0_START
          )
        : TIMELINE_START;


    rows.forEach(item => {

      if (
        !item.start ||
        !item.end
      )
        return;


      const start =
        timeToMin(item.start);

      const end =
        timeToMin(item.end);


      if (end <= start)
        return;


     const top =
  timelineTop(item.start, dayTimelineStart);

const height =
  timelineHeight(
    item.start,
    item.end,
    dayTimelineStart
  );

const VERTICAL_GAP = 8;

const finalTop =
  top + VERTICAL_GAP / 2;

const finalHeight =
  Math.max(
    height - VERTICAL_GAP,
    20
  );


      /* =====================================================
         BREAK
      ===================================================== */

      if (
        item.kind !== "class"
      ) {

        const breakCard =
          document.createElement("div");

        breakCard.className =
          "break-card";


        breakCard.style.top =
  `${finalTop}px`;

breakCard.style.height =
  `${finalHeight}px`;


        let label =
          "Break";


        if (
          item.kind === "lunch"
        )
          label = "Lunch";


        if (
          item.kind === "break"
        )
          label = "Recess";


        if (
          item.kind === "assembly"
        )
          label = "Assembly";


        breakCard.innerHTML =
          `<span class="tag">${label}</span>`;


        column.appendChild(
          breakCard
        );


        return;
      }


      /* =====================================================
         CLASS CARD
      ===================================================== */

      const card =
        document.createElement("div");


      card.className =
        "cls";


      card.style.top =
  `${finalTop}px`;

card.style.height =
  `${finalHeight}px`;


      card.style.setProperty(
        "--c",
        colorForSubject(
          item.subjKey
        )
      );


      if (
        isNowActive(
          currentWeek,
          day,
          item.start,
          item.end
        )
      ) {

        card.classList.add("now");
      }


      /*
        CODE
        Example:

        11ENA D2
      */

      const code =
        document.createElement("div");

      code.className =
        "code";

      code.textContent =
        item.code || "";

      card.appendChild(code);


      /*
        TEACHER
        Example:

        Rachele Haigh
      */

      const teacher =
        document.createElement("div");

      teacher.className =
        "teacher";

      teacher.textContent =
        item.teacher || "";


      if (item.teacher) {

        card.appendChild(
          teacher
        );
      }


      /*
        ROOM
        Example:

        AR1008.141
      */

      const room =
        document.createElement("div");

      room.className =
        "room";

      room.textContent =
        item.room || "";


      if (item.room) {

        card.appendChild(
          room
        );
      }


      column.appendChild(card);

    });


    grid.appendChild(column);

  });


  /* Labels */

  document.getElementById(
    "weekLabel"
  ).textContent =
    `Week ${currentWeek}`;


  document.getElementById(
    "dayLabel"
  ).textContent =
    DAY_LABELS[mobileDay];


  document.getElementById(
    "dayWeekLabel"
  ).textContent =
    `Week ${mobileWeek}`;

}


/* =========================================================
   NOW BOX
========================================================= */

function updateBell() {

  const line1 =
    document.getElementById(
      "bellLine1"
    );

  const line2 =
    document.getElementById(
      "bellLine2"
    );


  if (!TODAY_CYCLE_DAY) {

    line1.textContent =
      "No school today";

    line2.textContent =
      "Weekend or outside term";

    return;
  }


  const {
    dayKey,
    week
  } =
    dayNameToParts(
      TODAY_CYCLE_DAY
    );


  const now =
    new Date();


  const cur =
    now.getHours() * 60 +
    now.getMinutes();


  const rows =
    SCHEDULE[week]?.[dayKey] ||
    [];


  let current = null;
  let next = null;


  for (const item of rows) {

    if (
      !item.start ||
      !item.end
    )
      continue;


    const s =
      timeToMin(item.start);

    const e =
      timeToMin(item.end);


    if (
      cur >= s &&
      cur < e
    ) {

      if (
        item.kind === "class"
      )
        current = item;

      break;
    }


    if (
      cur < s &&
      !next &&
      item.kind === "class"
    ) {

      next = item;
    }
  }


  if (current) {

    line1.textContent =
      `${current.code} — ${current.subjName}`;


    line2.textContent =
      `until ${formatTime(current.end)}` +
      (
        current.room
          ? ` · ${current.room}`
          : ""
      );


    return;
  }


  if (next) {

    line1.textContent =
      `Next: ${next.code}`;


    line2.textContent =
      `from ${formatTime(next.start)}` +
      (
        next.room
          ? ` · ${next.room}`
          : ""
      );


    return;
  }


  line1.textContent =
    "No more classes today";


  line2.textContent =
    DAY_LABELS[dayKey];
}


/* =========================================================
   REFRESH
========================================================= */

async function refresh(
  force = false
) {

  refreshBtn.disabled =
    true;


  setStatus(
    force
      ? "Refreshing timetable…"
      : "Loading timetable…"
  );


  const currentEmail =
    getCurrentEmail();


  updateProfileDisplay(
    currentEmail
  );


  try {

    const {
      timetable,
      bellTimes,
      startDate,
      profile,
      fetchedAt
    } =
      await timetableService
        .loadAll(force);


    const cycleStart =
      extractDateString(
        startDate
      );


    const cycleStartDate =
      cycleStart
        ? new Date(cycleStart)
        : null;


    TODAY_CYCLE_DAY =
      cycleStartDate
        ? getTimetableDay(
            new Date(),
            cycleStartDate
          )
        : null;


    if (TODAY_CYCLE_DAY) {

      currentWeek =
        TODAY_CYCLE_DAY.slice(-1);


      const dayIdx =
        DAY_ORDER.indexOf(
          TODAY_CYCLE_DAY
            .slice(0, 3)
            .toLowerCase()
        );


      seqIndex =
        WEEK_ORDER.indexOf(
          currentWeek
        ) * 5 +

        (
          dayIdx >= 0
            ? dayIdx
            : 0
        );
    }


    SCHEDULE =
      normalizeTimetable(
        timetable,
        bellTimes
      );


    updateProfileDisplay(
      currentEmail,
      profile
    );


    setStatus(null);


    if (fetchedAt) {

      updatedAtEl.textContent =
        `Updated ${
          fetchedAt.toLocaleTimeString(
            [],
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )
        }`;
    }


    build();

    updateBell();

  } catch (err) {

    const message =
      err instanceof ApiError
        ? `Unable to load timetable. ${err.message}`
        : "Unable to load timetable. An unexpected error occurred.";


    setStatus(
      message,
      true
    );


    console.error(
      "Timetable load failed:",
      err
    );

  } finally {

    refreshBtn.disabled =
      false;
  }
}


/* =========================================================
   EMAIL INPUT
========================================================= */

const emailInput =
  document.getElementById(
    "emailInput"
  );


const savedUsername =
  localStorage.getItem("timetable-username");

emailInput.value =
  savedUsername ||

emailInput.addEventListener(

    const username =
      event.target.value.trim();


    updateProfileDisplay(
      username
        ? username +
          "@education.nsw.gov.au"
        : CONFIG.USER_EMAIL
    );

  }
);


emailInput.addEventListener(
  "change",
  event => {

    let username =
      event.target.value.trim();


    if (!username)
      return;


    if (username.includes("@"))
      username =
        username.split("@")[0];


    CONFIG.USER_EMAIL =
  username +
  "@education.nsw.gov.au";

localStorage.setItem(
  "timetable-username",
  username
);

refresh(true);

  }
);


emailInput.addEventListener(
  "keydown",
  event => {

    if (event.key !== "Enter")
      return;


    event.preventDefault();


    let username =
      emailInput.value.trim();


    if (!username)
      return;


    if (username.includes("@"))
      username =
        username.split("@")[0];


    CONFIG.USER_EMAIL =
  username +
  "@education.nsw.gov.au";

localStorage.setItem(
  "timetable-username",
  username
);

refresh(true);

  }
);


/* =========================================================
   BUTTONS
========================================================= */

refreshBtn.addEventListener(
  "click",
  () => refresh(true)
);


document
  .getElementById("weekPrev")
  .addEventListener(
    "click",
    () => {

      currentWeek =
        currentWeek === "A"
          ? "B"
          : "A";


      seqIndex =
        WEEK_ORDER.indexOf(
          currentWeek
        ) * 5 +

        (
          seqIndex % 5
        );


      build();
    }
  );


document
  .getElementById("weekNext")
  .addEventListener(
    "click",
    () => {

      currentWeek =
        currentWeek === "A"
          ? "B"
          : "A";


      seqIndex =
        WEEK_ORDER.indexOf(
          currentWeek
        ) * 5 +

        (
          seqIndex % 5
        );


      build();
    }
  );


document
  .getElementById("dayPrev")
  .addEventListener(
    "click",
    () => {

      seqIndex =
        (seqIndex + 9) % 10;


      currentWeek =
        WEEK_ORDER[
          Math.floor(
            seqIndex / 5
          )
        ];


      build();
    }
  );


document
  .getElementById("dayNext")
  .addEventListener(
    "click",
    () => {

      seqIndex =
        (seqIndex + 1) % 10;


      currentWeek =
        WEEK_ORDER[
          Math.floor(
            seqIndex / 5
          )
        ];


      build();
    }
  );


/* =========================================================
   INITIAL LOAD
========================================================= */

refresh(false);


setInterval(
  () => {

    updateBell();

    build();

  },
  60000
);


/* =========================================================
   THEME
========================================================= */

const themeSwitch =
  document.getElementById(
    "themeSwitch"
  );


const mq =
  window.matchMedia(
    "(prefers-color-scheme: dark)"
  );


function applyTheme(theme) {

  document.documentElement
    .dataset.theme =
    theme;


  const isDark =
    theme === "dark";


  themeSwitch.classList.toggle(
    "on",
    isDark
  );


  themeSwitch.setAttribute(
    "aria-checked",
    String(isDark)
  );
}


const stored =
  localStorage.getItem(
    "timetable-theme"
  );


applyTheme(
  stored || "light"
);


mq.addEventListener(
  "change",
  event => {

    if (
      !localStorage.getItem(
        "timetable-theme"
      )
    ) {

      applyTheme(
        event.matches
          ? "dark"
          : "light"
      );
    }
  }
);


themeSwitch.addEventListener(
  "click",
  () => {

    const next =
      document.documentElement
        .dataset.theme === "dark"
        ? "light"
        : "dark";


    localStorage.setItem(
      "timetable-theme",
      next
    );


    applyTheme(next);
  }
);


/* =========================================================
   OUTLINE-BY-COLOUR SETTING
========================================================= */

const outlineSwitch =
  document.getElementById(
    "outlineSwitch"
  );

const OUTLINE_STORAGE_KEY =
  "timetable-outline-colors";

let outlineByColor =
  localStorage.getItem(
    OUTLINE_STORAGE_KEY
  ) !== "0";


function applyOutlineSetting() {

  grid.dataset.outlineColors =
    outlineByColor
      ? "1"
      : "0";


  outlineSwitch.classList.toggle(
    "on",
    outlineByColor
  );


  outlineSwitch.setAttribute(
    "aria-checked",

  );

applyOutlineSetting();


outlineSwitch.addEventListener(

    outlineByColor =
      !outlineByColor;


    localStorage.setItem(
      OUTLINE_STORAGE_KEY,
      outlineByColor
        ? "1"

    );

/* =========================================================
   INFORMATION POPUP
========================================================= */

const infoBtn =
  document.getElementById("infoToggle");

const infoOverlay =
  document.getElementById("infoOverlay");

const infoClose =
  document.getElementById("infoClose");

const infoTextarea =
  document.getElementById("infoTextarea");

const infoClear =
  document.getElementById("infoClear");

const infoSaved =
  document.getElementById("infoSaved");

const INFO_STORAGE_KEY =
  "timetable-extra-information";


/* Load saved information */

const savedInfo =
  localStorage.getItem(
    INFO_STORAGE_KEY
  );

if (savedInfo !== null) {
  infoTextarea.value = savedInfo;
}


/* Open popup */

function openInfoPopup() {
  infoOverlay.classList.add("open");

  document.body.style.overflow = "hidden";

  setTimeout(() => {
    infoTextarea.focus();
  }, 150);
}


/* Close popup */

function closeInfoPopup() {
  infoOverlay.classList.remove("open");

  document.body.style.overflow = "";
}


/* Information button */

infoBtn.addEventListener(
  "click",
  openInfoPopup
);


/* Close button */

infoClose.addEventListener(
  "click",
  closeInfoPopup
);


/* Click outside popup */

infoOverlay.addEventListener(
  "click",
  event => {
    if (
      event.target === infoOverlay
    ) {
      closeInfoPopup();
    }
  }
);


/* Escape key */

document.addEventListener(
  "keydown",
  event => {
    if (
      event.key === "Escape" &&
      infoOverlay.classList.contains("open")
    ) {
      closeInfoPopup();
    }
  }
);


/* Automatically save text */

infoTextarea.addEventListener(
  "input",
  () => {

    localStorage.setItem(
      INFO_STORAGE_KEY,
      infoTextarea.value
    );

    infoSaved.textContent =
      "Saved automatically";
  }
);


/* Clear button */

infoClear.addEventListener(
  "click",
  () => {

    if (
      !confirm(
        "Clear all information?"
      )
    ) {
      return;
    }

    infoTextarea.value = "";

    localStorage.removeItem(
      INFO_STORAGE_KEY
    );

    infoSaved.textContent =
      "Cleared";
  }
);
